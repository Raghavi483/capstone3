# GitLab CI/CD Pipeline for MediCard Cashless Platform (BC-AINE-017)
# Fully reproducible pipeline adhering to Section 12 & 13.

stages:
  - install
  - lint
  - migrate
  - test
  - architecture
  - security
  - coverage
  - playwright
  - evaluate
  - build

variables:
  PYTHON_VERSION: "3.12"
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  PLAYWRIGHT_BROWSERS_PATH: "$CI_PROJECT_DIR/.cache/ms-playwright"

cache:
  paths:
    - .cache/pip
    - .cache/ms-playwright
    - .venv/

install_dependencies:
  stage: install
  image: python:3.12-slim
  script:
    - python -m venv .venv
    - . .venv/bin/activate
    - pip install --upgrade pip
    - pip install pytest pytest-cov sqlalchemy alembic fastapi uvicorn pydantic requests playwright anthropic
  artifacts:
    paths:
      - .venv/

lint_and_hooks:
  stage: lint
  image: python:3.12-slim
  script:
    - . .venv/bin/activate
    - chmod +x .claude/hooks/*.sh
    - .claude/hooks/phi-redaction-check.sh
    - .claude/hooks/settlement-cap-check.sh
    - .claude/hooks/role-boundary-check.sh
    - .claude/hooks/architecture-boundary-check.sh

database_migrations:
  stage: migrate
  image: python:3.12-slim
  script:
    - . .venv/bin/activate
    - echo "[CI] Running Alembic Schema Migrations to Head..."
    - alembic upgrade head
    - echo "[CI] Verifying database seeding on freshly migrated schema..."
    - python -c "from src.repositories.database import init_db; init_db(); from src.seed_data import seed_database; seed_database()"

unit_tests:
  stage: test
  image: python:3.12-slim
  script:
    - . .venv/bin/activate
    - pytest tests/unit/ -v

architecture_tests:
  stage: architecture
  image: python:3.12-slim
  script:
    - . .venv/bin/activate
    - pytest tests/architecture/ -v

security_tests:
  stage: security
  image: python:3.12-slim
  script:
    - . .venv/bin/activate
    - pytest tests/security/ -v

coverage_verification:
  stage: coverage
  image: python:3.12-slim
  script:
    - . .venv/bin/activate
    - pytest --cov=src --cov-report=xml:coverage.xml --cov-report=term-missing tests/unit tests/architecture tests/security
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml
    paths:
      - coverage.xml

playwright_e2e:
  stage: playwright
  image: mcr.microsoft.com/playwright/python:v1.49.1-jammy
  script:
    - python -m venv .venv
    - . .venv/bin/activate
    - pip install pytest sqlalchemy alembic fastapi uvicorn pydantic requests playwright
    - playwright install --with-deps chromium
    - echo "[CI] Executing full Playwright E2E browser test suite..."
    - pytest tests/e2e/test_playwright_e2e.py -v -s
  artifacts:
    when: always
    paths:
      - tests/e2e/snapshots/
    expire_in: 7 days

claude_code_evaluation:
  stage: evaluate
  image: python:3.12-slim
  script:
    - . .venv/bin/activate
    - |
      if [ -n "$ANTHROPIC_API_KEY" ]; then
        echo "[CI] ANTHROPIC_API_KEY detected. Executing REAL Claude Agent SDK Evaluation..."
        python scripts/run_feature_agent.py --ac AC-07 --spec specs/settlement_spec.md --agent settlement-agent --execute
      else
        echo "[CI] WARNING: ANTHROPIC_API_KEY secret variable is not configured on CI runner."
        echo "[CI] Executing verification contract in DRY RUN mode..."
        python scripts/run_feature_agent.py --ac AC-07 --spec specs/settlement_spec.md --agent settlement-agent --dry-run
      fi
  artifacts:
    paths:
      - specs/reviews/
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "main"'

build_package:
  stage: build
  image: python:3.12-slim
  script:
    - . .venv/bin/activate
    - echo "[CI] Auditing Codebase Metrics & Packaging MediCard Cashless Platform..."
    - python scripts/loc_report.py
    - python -c "from src.main import app; print('FastAPI Application Module Verified:', app.title)"
    - python -c "import json; p = json.load(open('plugin.json')); print('Substrate Plugin Validated:', p['name'])"
